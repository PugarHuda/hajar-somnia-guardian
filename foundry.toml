[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./node_modules" }]

# Somnia networks. Set RPCs and PRIVATE_KEY in .env (see .env.example).
[rpc_endpoints]
somnia_testnet = "${SOMNIA_TESTNET_RPC}"
somnia_mainnet = "${SOMNIA_RPC}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
